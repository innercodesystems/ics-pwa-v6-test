name: ICS Navigation Guard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  navigation-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ICS navigation wiring
        run: node tests/navigation-guard.cjs
  browser-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Start local test server
        run: python3 -m http.server 4173 --bind 127.0.0.1 &
      - name: Click-test navigation in Chromium
        run: npx playwright test tests/navigation-click.spec.cjs tests/navigation-session.spec.cjs tests/navigation-login.spec.cjs --reporter=line
