name: Patch ICS Academy link

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/open-academy-new-tab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Change academy button to new tab link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          t = p.read_text(encoding="utf-8")
          start = t.index('<button class="menu-card" id="openAcademy"')
          end = t.index('</button>', start) + len('</button>')
          old = t[start:end]
          new = old.replace('<button class="menu-card" id="openAcademy"\n        onclick="window.location.href=\'https://innercodesystems.com/ics-akademie\'">', '<a class="menu-card" id="openAcademy" href="https://innercodesystems.com/ics-akademie" target="_blank" rel="noopener noreferrer" style="text-decoration:none;">').replace('</button>', '</a>')
          if old == new:
              raise SystemExit("Academy block was not changed")
          p.write_text(t[:start] + new + t[end:], encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Open ICS Akademie in new tab"
          git push
