name: Fix ICS Academy navigation

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/open-academy-new-tab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open academy in new tab
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "onclick=\"window.location.href='https://innercodesystems.com/ics-akademie'\""
          new = "onclick=\"window.open('https://innercodesystems.com/ics-akademie','_blank','noopener,noreferrer')\""
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Academy navigation not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Open ICS Akademie in new tab"
          git push
