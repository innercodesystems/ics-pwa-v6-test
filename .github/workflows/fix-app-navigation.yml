name: Fix ICS Mehr navigation

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-app-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add direct Mehr navigation fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<button class="nav-item" data-view="mehr">'
          new = '''<button class="nav-item" data-view="mehr" onclick="const v=document.getElementById(\'view-mehr\');const s=document.querySelector(\'.app-shell\');if(v&&s&&v.parentElement!==s)s.appendChild(v);document.querySelectorAll(\'.app-view\').forEach(x=>x.classList.remove(\'active\'));if(v)v.classList.add(\'active\');document.querySelectorAll(\'.nav-item\').forEach(x=>x.classList.remove(\'active\'));this.classList.add(\'active\');window.scrollTo(0,0);">'''
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Mehr navigation button not found; no file changed.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add direct Mehr navigation fallback"
          git push
