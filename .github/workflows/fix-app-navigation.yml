name: Fix ICS Mehr navigation

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-app-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Mehr view placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          marker = "// ICS FIX: ensure Mehr view is a direct app-shell child"
          if marker in text:
              raise SystemExit(0)
          anchor = "const appViews = [...document.querySelectorAll('.app-view')];\n"
          if anchor not in text:
              raise SystemExit('Expected appViews declaration not found; no file changed.')
          patch = "const appViews = [...document.querySelectorAll('.app-view')];\n\n// ICS FIX: ensure Mehr view is a direct app-shell child\nconst appShell = document.querySelector('.app-shell');\nconst moreView = document.getElementById('view-mehr');\nif (appShell && moreView && moreView.parentElement !== appShell) {\n  appShell.appendChild(moreView);\n}\n"
          text = text.replace(anchor, patch, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Commit repair
        run: |
          if git diff --quiet -- app.js; then
            echo "No app.js change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix Mehr view navigation"
          git push
