name: Apply energy preview fix

on:
  push:
    branches:
      - fix/energy-preview-three

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/energy-preview-three

      - name: Limit energy preview to three entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text()
          start = text.index('function renderEnergyHistory()')
          end = text.index('function saveEnergyCheck(record)', start)
          block = text[start:end]

          if block.count('.slice(0, 5)') != 1:
              raise SystemExit('Expected unique five-entry preview limit not found')

          updated = block.replace('.slice(0, 5)', '.slice(0, 3)', 1)
          path.write_text(text[:start] + updated + text[end:])
          PY

      - name: Validate JavaScript and diff
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Limit energy preview to three checks"
          git push origin HEAD:fix/energy-preview-three
